name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Só um deploy por vez; não cancela um deploy que já está em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      # Site estático (HTML/CSS/JS): não há build, publica apenas os arquivos do site
      - name: Separar os arquivos do site
        run: |
          mkdir -p _site
          cp index.html style.css app.js _site/
          cp -r img _site/

      - name: Enviar os arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
